name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "integration/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  relay-op-contract:
    name: Relay op contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check checker syntax
        run: python -m py_compile python/tools/check_relay_op_contract.py

      - name: Check Relay op implementation contract
        run: python python/tools/check_relay_op_contract.py --root .

  cpu-smoke:
    name: CPU smoke (task DAG ${{ matrix.region_task_dag }}, control ${{ matrix.control_runtime }}, preparation ${{ matrix.production_adapters }}, v2 ${{ matrix.w3_adapters }}, dynamic ABI ${{ matrix.dynamic_module_abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - region_task_dag: "OFF"
            control_runtime: "OFF"
            production_adapters: "OFF"
            w3_adapters: "OFF"
            dynamic_module_abi: "OFF"
          - region_task_dag: "OFF"
            control_runtime: "OFF"
            production_adapters: "OFF"
            w3_adapters: "OFF"
            dynamic_module_abi: "ON"
          - region_task_dag: "OFF"
            control_runtime: "OFF"
            production_adapters: "ON"
            w3_adapters: "OFF"
            dynamic_module_abi: "ON"
          - region_task_dag: "OFF"
            control_runtime: "ON"
            production_adapters: "ON"
            w3_adapters: "ON"
            dynamic_module_abi: "OFF"
          - region_task_dag: "ON"
            control_runtime: "OFF"
            production_adapters: "ON"
            w3_adapters: "ON"
            dynamic_module_abi: "ON"
          - region_task_dag: "ON"
            control_runtime: "ON"
            production_adapters: "ON"
            w3_adapters: "ON"
            dynamic_module_abi: "OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CPU-only build
        run: >
          cmake -S . -B out/build/ci-cpu-${{ matrix.region_task_dag }}-${{ matrix.control_runtime }}-${{ matrix.production_adapters }}-${{ matrix.w3_adapters }}
          -DCMAKE_BUILD_TYPE=Debug
          -DKXC_ENABLE_CUDA=OFF
          -DKXC_ENABLE_LLVM=OFF
          -DKXC_ENABLE_REGION_TASK_DAG=${{ matrix.region_task_dag }}
          -DKXC_ENABLE_CONTROL_RUNTIME=${{ matrix.control_runtime }}
          -DKXC_ENABLE_SHAPE_PRODUCTION_EXACT=${{ matrix.production_adapters }}
          -DKXC_ENABLE_EXPERIMENTAL_ADAPTIVE_PRODUCTION=${{ matrix.production_adapters }}
          -DKXC_ENABLE_RESTRICTED_SYMBOLIC_SHAPE=${{ matrix.w3_adapters }}
          -DKXC_ENABLE_DYNAMIC_COMPILED_MODULE_ABI=${{ matrix.dynamic_module_abi }}
          -DKXC_ENABLE_ADAPTIVE_HOT_SWAP_V2=${{ matrix.w3_adapters }}
          -DKXC_BUILD_RESNET18_IR_DUMP=OFF
          -DKXC_BUILD_PASS_TESTS=ON
          -DKXC_BUILD_CODEGEN_TESTS=OFF

      - name: Build CPU targets
        run: >
          cmake --build out/build/ci-cpu-${{ matrix.region_task_dag }}-${{ matrix.control_runtime }}-${{ matrix.production_adapters }}-${{ matrix.w3_adapters }}
          --parallel 2

      - name: Run runtime plan CTest suite
        run: >
          cmake --build out/build/ci-cpu-${{ matrix.region_task_dag }}-${{ matrix.control_runtime }}-${{ matrix.production_adapters }}-${{ matrix.w3_adapters }}
          --target run_runtime_plan_tests --parallel 2

      - name: Check dependency-free NLP reference and capability gate
        run: >
          cmake --build out/build/ci-cpu-${{ matrix.region_task_dag }}-${{ matrix.control_runtime }}-${{ matrix.production_adapters }}-${{ matrix.w3_adapters }}
          --target check_nlp_gpu_validation

      - name: Run all CPU foundation CTest checks
        run: >
          ctest --test-dir out/build/ci-cpu-${{ matrix.region_task_dag }}-${{ matrix.control_runtime }}-${{ matrix.production_adapters }}-${{ matrix.w3_adapters }}
          --output-on-failure --no-tests=error
          --label-regex '(^|;)cpu(;|$)'


  cpu-asan:
    name: CPU v2 runtime/adaptive/control ASan/UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure sanitizer build
        run: >
          cmake -S . -B out/build/ci-runtime-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DKXC_ENABLE_CUDA=OFF
          -DKXC_ENABLE_LLVM=OFF
          -DKXC_ENABLE_REGION_TASK_DAG=ON
          -DKXC_ENABLE_CONTROL_RUNTIME=ON
          -DKXC_ENABLE_SHAPE_PRODUCTION_EXACT=ON
          -DKXC_ENABLE_RESTRICTED_SYMBOLIC_SHAPE=ON
          -DKXC_ENABLE_DYNAMIC_COMPILED_MODULE_ABI=ON
          -DKXC_ENABLE_EXPERIMENTAL_ADAPTIVE_PRODUCTION=ON
          -DKXC_ENABLE_ADAPTIVE_HOT_SWAP_V2=ON
          -DKXC_BUILD_RESNET18_IR_DUMP=OFF
          -DKXC_BUILD_PASS_TESTS=ON
          -DKXC_BUILD_CODEGEN_TESTS=OFF
          -DCMAKE_CXX_FLAGS_DEBUG="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build v2 sanitizer targets
        run: >
          cmake --build out/build/ci-runtime-asan --parallel 2 --target
          task_plan_test task_executor_test runtime_session_test
          shape_production_exact_test restricted_symbolic_shape_test compiled_module_test
          relay_control_plan_test control_runtime_integration_test
          adaptive_hot_swap_v2_test

      - name: Run v2 sanitizer suite
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          ctest --test-dir out/build/ci-runtime-asan
          --output-on-failure --no-tests=error
          --tests-regex '^(task_plan_test|task_executor_test|runtime_session_test|compiled_module_test|shape_production_exact_test|restricted_symbolic_shape_test|relay_control_plan_test|control_runtime_integration_test|adaptive_hot_swap_v2_test)$'

  cpu-tsan-adaptive-v2:
    name: CPU adaptive v2 TSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure TSan build
        run: >
          cmake -S . -B out/build/ci-adaptive-v2-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DKXC_ENABLE_CUDA=OFF
          -DKXC_ENABLE_LLVM=OFF
          -DKXC_ENABLE_EXPERIMENTAL_ADAPTIVE_PRODUCTION=ON
          -DKXC_ENABLE_ADAPTIVE_HOT_SWAP_V2=ON
          -DKXC_BUILD_RESNET18_IR_DUMP=OFF
          -DKXC_BUILD_PASS_TESTS=ON
          -DKXC_BUILD_CODEGEN_TESTS=OFF
          -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g -fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build adaptive v2 TSan target
        run: >
          cmake --build out/build/ci-adaptive-v2-tsan --parallel 2
          --target adaptive_hot_swap_v2_test

      - name: Run adaptive v2 TSan test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >
          ctest --test-dir out/build/ci-adaptive-v2-tsan
          --output-on-failure --no-tests=error
          --tests-regex '^adaptive_hot_swap_v2_test$'

  llvm-resnet18:
    name: ResNet18 LLVM compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++ llvm-dev lld

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ONNX fixture dependencies
        run: python -m pip install --upgrade pip onnx numpy

      - name: Configure LLVM build
        run: >
          cmake -S . -B out/build/ci-llvm -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DKXC_ENABLE_CUDA=OFF
          -DKXC_ENABLE_LLVM=ON
          -DKXC_ENABLE_REGION_TASK_DAG=ON
          -DKXC_ENABLE_CONTROL_RUNTIME=ON
          -DKXC_ENABLE_SHAPE_PRODUCTION_EXACT=ON
          -DKXC_ENABLE_RESTRICTED_SYMBOLIC_SHAPE=ON
          -DKXC_ENABLE_DYNAMIC_COMPILED_MODULE_ABI=ON
          -DKXC_ENABLE_EXPERIMENTAL_ADAPTIVE_PRODUCTION=ON
          -DKXC_ENABLE_ADAPTIVE_HOT_SWAP_V2=ON
          -DKXC_BUILD_RESNET18_IR_DUMP=OFF
          -DKXC_BUILD_DEBUG_EXAMPLES=OFF
          -DKXC_BUILD_PASS_TESTS=ON
          -DKXC_BUILD_CODEGEN_TESTS=ON

      - name: Build LLVM compiler and numeric test targets
        run: >
          cmake --build out/build/ci-llvm --parallel 2 --target
          operator_compilation_test codegen_llvm_test op_numeric_llvm_test
          onnx_importer_test runtime_session_test shape_production_exact_test
          restricted_symbolic_shape_test compiled_module_test
          compiled_module_dynamic_llvm_test control_runtime_integration_test
          adaptive_hot_swap_v2_test

      - name: Run production compiler-to-task-DAG E2E
        run: >
          ctest --test-dir out/build/ci-llvm --output-on-failure
          --no-tests=error --tests-regex '^operator_compilation_test$'

      - name: Run remaining LLVM codegen, numeric, importer, runtime, and shape checks
        run: >
          ctest --test-dir out/build/ci-llvm --output-on-failure
          --no-tests=error
          --tests-regex '^(codegen_llvm_test|op_numeric_llvm_test|compiled_module_dynamic_llvm_test|onnx_importer_test|runtime_session_test|compiled_module_test|shape_production_exact_test|restricted_symbolic_shape_test|control_runtime_integration_test|adaptive_hot_swap_v2_test)$'

  python-onnx-importer:
    name: Python ONNX importer tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest onnx numpy

      - name: Run Python ONNX importer tests
        env:
          PYTHONPATH: python
        run: python -m pytest test/onnx_importer_py_test.py -q
